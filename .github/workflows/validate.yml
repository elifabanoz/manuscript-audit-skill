name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - run: pandoc --version
      - run: python -m pip install -r requirements-pdf.txt -r requirements-stats.txt 'reportlab>=4,<5'
      - run: python skills/manuscript-audit/roles/gen_agents.py --check --output-root .
      - run: node --test skills/manuscript-audit/validators/validators.test.cjs
      - run: python -m unittest discover -s skills/manuscript-audit/tools -p 'test_*.py'
      - run: python -m unittest discover -s bench/compliance-mutations -p 'test_*.py'
      - run: python -m unittest discover -s bench/parsing -p 'test_*.py'
      - run: node -e "const fs=require('node:fs'); for (const file of fs.readdirSync('skills/manuscript-audit/schemas')) JSON.parse(fs.readFileSync('skills/manuscript-audit/schemas/'+file, 'utf8'))"
